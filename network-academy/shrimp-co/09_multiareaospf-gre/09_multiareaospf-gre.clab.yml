name: 9_multiareaospf-gre-bgp

mgmt:
  network: custom_mgmt
  ipv4-subnet: 172.20.25.0/24

topology:
  kinds:
    arista_ceos:
      startup-config: configs/__clabNodeName__.cfg
      enforce-startup-config: true
    cisco_iol:
      startup-config: configs/__clabNodeName__.cfg.partial
      enforce-startup-config: true

  nodes:

    # Access Switches
    sea-a1-asw1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.25.74
      image: ceos:4.34.4M

    sea-b1-asw1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.25.75
      image: ceos:4.34.4M

    mke-a1-asw1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.25.81
      image: ceos:4.34.4M

    msp-a1-asw1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.25.84
      image: ceos:4.34.4M

    # Distribution Switches
    sea-mdf-dsw1:
     kind: arista_ceos
     mgmt-ipv4: 172.20.25.76
     image: ceos:4.34.4M

    sea-mdf-dsw2:
     kind: arista_ceos
     mgmt-ipv4: 172.20.25.77
     image: ceos:4.34.4M

    # Routers
    sea-mdf-r1:
      kind: cisco_iol
      mgmt-ipv4: 172.20.25.78
      image: vrnetlab/cisco_iol:17.15.01

    sea-mdf-r2:
      kind: cisco_iol
      mgmt-ipv4: 172.20.25.79
      image: vrnetlab/cisco_iol:17.15.01

    mke-a1-r1:
      kind: cisco_iol
      mgmt-ipv4: 172.20.25.82
      image: vrnetlab/cisco_iol:17.15.01

    msp-a1-r1:
      kind: cisco_iol
      mgmt-ipv4: 172.20.25.83
      image: vrnetlab/cisco_iol:17.15.01

    volt-r1:
      kind: cisco_iol
      mgmt-ipv4: 172.20.25.86
      image: vrnetlab/cisco_iol:17.15.01

    # Hosts
    seamart-server:
      kind: linux
      mgmt-ipv4: 172.20.25.87
      image: networkchadmin/seamart-web:2.0
      exec:
        - ip route del default
        - ssh-keygen -A
        - service ssh start
        - service nginx start
        - ip addr add 123.123.123.123/24 dev eth1
        - ip route add default via 123.123.123.1 dev eth1

    jim:
      kind: linux
      mgmt-ipv4: 172.20.25.80
      image: networkchadmin/network-host:2.0
      exec:
        - ip route del default
        - ssh-keygen -A
        - service ssh start

    sharon:
      kind: linux
      mgmt-ipv4: 172.20.25.85
      image: networkchadmin/network-host:2.0
      exec:
        - ip route del default
        - ssh-keygen -A
        - service ssh start

    bob:
      kind: linux
      mgmt-ipv4: 172.20.25.88
      image: networkchadmin/network-host:2.0
      exec:
        - ip route del default
        - ssh-keygen -A
        - service ssh start

    gerald:
      kind: linux
      mgmt-ipv4: 172.20.25.89
      image: networkchadmin/network-host:2.0
      exec:
        - ip route del default
        - ssh-keygen -A
        - service ssh start

    alice:
      kind: linux
      mgmt-ipv4: 172.20.25.90
      image: networkchadmin/network-host:2.0
      exec:
        - ip route del default
        - ssh-keygen -A
        - service ssh start

    steve:
      kind: linux
      mgmt-ipv4: 172.20.25.91
      image: networkchadmin/network-host:2.0
      exec:
        - ip route del default
        - ssh-keygen -A
        - service ssh start

    sandra:
      kind: linux
      mgmt-ipv4: 172.20.25.92
      image: networkchadmin/network-host:2.0
      exec:
        - ip route del default
        - ssh-keygen -A
        - service ssh start

    linda:
      kind: linux
      mgmt-ipv4: 172.20.25.93
      image: networkchadmin/network-host:2.0
      exec:
        - ip route del default
        - ssh-keygen -A
        - service ssh start

  links:
    # Host to Switch Links
    - endpoints: ["bob:eth1", "sea-a1-asw1:eth1"]
    - endpoints: ["alice:eth1", "sea-a1-asw1:eth2"]
    - endpoints: ["gerald:eth1", "sea-a1-asw1:eth3"]
    - endpoints: ["steve:eth1", "sea-b1-asw1:eth1"]
    - endpoints: ["sandra:eth1", "sea-b1-asw1:eth3"]
    - endpoints: ["linda:eth1", "sea-b1-asw1:eth2"]
    - endpoints: ["jim:eth1", "mke-a1-asw1:eth1"]
    - endpoints: ["sharon:eth1", "msp-a1-asw1:eth1"]
    # Switch to Switch Links
    - endpoints: ["sea-a1-asw1:eth4", "sea-b1-asw1:eth4"]
    - endpoints: ["sea-a1-asw1:eth5", "sea-b1-asw1:eth5"]
    - endpoints: ["sea-a1-asw1:eth6", "sea-mdf-dsw1:eth1"]
    - endpoints: ["sea-a1-asw1:eth7", "sea-mdf-dsw2:eth2"]
    - endpoints: ["sea-b1-asw1:eth6", "sea-mdf-dsw2:eth1"]
    - endpoints: ["sea-b1-asw1:eth7", "sea-mdf-dsw1:eth2"]
    - endpoints: ["sea-mdf-dsw1:eth3", "sea-mdf-dsw2:eth3"]
    - endpoints: ["sea-mdf-dsw1:eth4", "sea-mdf-dsw2:eth4"]
    # Switch to Router Links
    - endpoints: ["sea-mdf-dsw1:eth5", "sea-mdf-r1:e0/1"]
    - endpoints: ["sea-mdf-dsw1:eth6", "sea-mdf-r2:e0/2"]
    - endpoints: ["sea-mdf-dsw2:eth5", "sea-mdf-r2:e0/1"]
    - endpoints: ["sea-mdf-dsw2:eth6", "sea-mdf-r1:e0/2"]
    - endpoints: ["mke-a1-asw1:eth2", "mke-a1-r1:e0/1"]
    - endpoints: ["msp-a1-asw1:eth2", "msp-a1-r1:e0/1"]
    # Router to Router Links
    - endpoints: ["sea-mdf-r1:e0/3", "volt-r1:e0/1"]
    - endpoints: ["sea-mdf-r2:e0/3", "volt-r1:e0/2"]
    - endpoints: ["mke-a1-r1:e0/2", "volt-r1:e0/3"]
    - endpoints: ["msp-a1-r1:e0/2", "volt-r1:e1/0"]
    # Internet to Host Links
    - endpoints: [seamart-server:eth1, "volt-r1:e1/1"]