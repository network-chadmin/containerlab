name: 7_pat-dynamic-routing

mgmt:
  network: custom_mgmt
  ipv4-subnet: 172.20.25.0/24

topology:
  kinds:
    arista_ceos:
      startup-config: configs/__clabNodeName__.cfg
      enforce-startup-config: true
    cisco_iol:
      startup-config: configs/__clabNodeName__.cfg.partial
      enforce-startup-config: true

  nodes:

    # Access Switches
    sea-a1-asw1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.25.48
      image: ceos:4.34.4M

    sea-b1-asw1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.25.49
      image: ceos:4.34.4M

    # Distribution Switches
    sea-mdf-dsw1:
     kind: arista_ceos
     mgmt-ipv4: 172.20.25.50
     image: ceos:4.34.4M

    sea-mdf-dsw2:
     kind: arista_ceos
     mgmt-ipv4: 172.20.25.51
     image: ceos:4.34.4M

    # Routers
    sea-mdf-r1:
      kind: cisco_iol
      mgmt-ipv4: 172.20.25.52
      image: vrnetlab/cisco_iol:17.15.01

    sea-mdf-r2:
      kind: cisco_iol
      mgmt-ipv4: 172.20.25.53
      image: vrnetlab/cisco_iol:17.15.01

    volt-r1:
      kind: cisco_iol
      mgmt-ipv4: 172.20.25.54
      image: vrnetlab/cisco_iol:17.15.01

    # Hosts
    seamart-server:
      kind: linux
      mgmt-ipv4: 172.20.25.55
      image: networkchadmin/network-host:latest
      exec:
        - ip route del default
        - ssh-keygen -A
        - service ssh start
        - service nginx start
        - ip addr add 123.123.123.123/24 dev eth1
        - ip route add default via 123.123.123.1 dev eth1

    bob:
      kind: linux
      mgmt-ipv4: 172.20.25.56
      image: networkchadmin/network-host:latest
      exec:
        - ip route del default
        - ssh-keygen -A
        - service ssh start

    alice:
      kind: linux
      mgmt-ipv4: 172.20.25.57
      image: networkchadmin/network-host:latest
      exec:
        - ip route del default
        - ssh-keygen -A
        - service ssh start

    steve:
      kind: linux
      mgmt-ipv4: 172.20.25.58
      image: networkchadmin/network-host:latest
      exec:
        - ip route del default
        - ssh-keygen -A
        - service ssh start

    linda:
      kind: linux
      mgmt-ipv4: 172.20.25.59
      image: networkchadmin/network-host:latest
      exec:
        - ip route del default
        - ssh-keygen -A
        - service ssh start

  links:
    # Host to Switch Links
    - endpoints: ["bob:eth1", "sea-a1-asw1:eth1"]
    - endpoints: ["alice:eth1", "sea-a1-asw1:eth2"]
    - endpoints: ["steve:eth1", "sea-b1-asw1:eth1"]
    - endpoints: ["linda:eth1", "sea-b1-asw1:eth2"]
    # Switch to Switch Links
    - endpoints: ["sea-a1-asw1:eth3", "sea-b1-asw1:eth3"]
    - endpoints: ["sea-a1-asw1:eth4", "sea-b1-asw1:eth4"]
    - endpoints: ["sea-a1-asw1:eth5", "sea-mdf-dsw1:eth1"]
    - endpoints: ["sea-b1-asw1:eth5", "sea-mdf-dsw2:eth1"]
    - endpoints: ["sea-mdf-dsw1:eth3", "sea-mdf-dsw2:eth3"]
    - endpoints: ["sea-mdf-dsw1:eth4", "sea-mdf-dsw2:eth4"]
    # Switch to Router Links
    - endpoints: ["sea-mdf-dsw1:eth2", "sea-mdf-r1:e0/1"]
    - endpoints: ["sea-mdf-dsw1:eth5", "sea-mdf-r2:e0/2"]
    - endpoints: ["sea-mdf-dsw2:eth5", "sea-mdf-r1:e0/2"]
    - endpoints: ["sea-mdf-dsw2:eth2", "sea-mdf-r2:e0/1"]
    # Router to Router Links
    - endpoints: ["sea-mdf-r1:e0/3", "volt-r1:e0/1"]
    - endpoints: ["sea-mdf-r2:e0/3", "volt-r1:e0/2"]
    # Internet to Host Links
    - endpoints: [seamart-server:eth1, "volt-r1:e0/3"]